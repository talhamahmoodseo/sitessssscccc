<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LinkedIn banner v5 (mint), Talha Mahmood</title>
<!--
  1584 x 396. Style reference: a light banner with a mint photo panel on the
  left, the person in full colour in the middle, a big black headline with one
  warm accent on the right, and a logo strip. Mint matches Talha's current
  profile photo background (#B2D8C1), so photo and banner read as one.
  render.cjs exports banner-1584x396.png, banner-3168x792.png and a preview.
-->
<style>
  @font-face { font-family: PJS; src: url(../assets/plus-jakarta-sans-latin-500-normal.woff2); font-weight: 500; }
  @font-face { font-family: PJS; src: url(../assets/plus-jakarta-sans-latin-600-normal.woff2); font-weight: 600; }
  @font-face { font-family: PJS; src: url(../assets/plus-jakarta-sans-latin-700-normal.woff2); font-weight: 700; }
  @font-face { font-family: PJS; src: url(../assets/plus-jakarta-sans-latin-800-normal.woff2); font-weight: 800; }
  :root { --mint: #A8DCC0; --ink: #0E0E0E; --amber: #F2A60C; --paper: #F5F6F5; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1584px; height: 396px; overflow: hidden; }
  body { font-family: PJS, system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  .banner { position: relative; width: 1584px; height: 396px; overflow: hidden; background: var(--paper); }

  /* left: mint panel with a dim SEO-dashboard photo, fading into the light side */
  .panel { position: absolute; left: 0; top: 0; width: 900px; height: 396px; background: var(--mint);
    -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 62%, transparent 92%);
            mask-image: linear-gradient(90deg, #000 0%, #000 62%, transparent 92%); }
  .panel::before { content: ""; position: absolute; inset: 0; background: url(../assets/bg-laptop-mint.jpg) center / cover; opacity: 0.38; mix-blend-mode: multiply; }

  .me { position: absolute; left: 470px; top: -26px; height: 452px; filter: drop-shadow(0 18px 26px rgb(0 0 0 / 0.22)); }

  .avail { position: absolute; left: 30px; top: 24px; display: inline-flex; align-items: center; gap: 10px;
    background: var(--ink); color: #fff; border-radius: 10px; padding: 9px 16px 9px 14px;
    font-size: 17px; font-weight: 800; letter-spacing: 0.01em; text-transform: uppercase; }
  .avail i { width: 12px; height: 12px; border-radius: 50%; background: #2BD46A; box-shadow: 0 0 0 4px rgb(43 212 106 / 0.25); }
  .avail b { color: var(--amber); }

  /* right: the message, centred */
  .copy { position: absolute; left: 880px; right: 24px; top: 30px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .pill { background: var(--ink); color: #fff; border-radius: 12px; padding: 9px 20px; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  .pill s { text-decoration: none; position: relative; color: rgb(255 255 255 / 0.6); }
  .pill s::after { content: ""; position: absolute; left: -1px; right: -1px; top: 54%; height: 2px; background: var(--amber); border-radius: 2px; }
  h1 { margin-top: 24px; font-size: 54px; line-height: 1.08; font-weight: 800; letter-spacing: -0.03em; }
  h1 em { font-style: normal; color: var(--amber); }
  .label { position: absolute; left: 880px; right: 24px; bottom: 98px; text-align: center; font-size: 14px; font-weight: 600; letter-spacing: 0.32em; color: #3A3A3A; }

  .strip { position: absolute; left: 860px; right: 0; bottom: 0; height: 84px; background: #fff;
    display: flex; align-items: center; justify-content: center; gap: 64px;
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 90px); mask-image: linear-gradient(90deg, transparent 0, #000 90px); }
  .strip img { display: block; filter: brightness(0); }
</style>
</head>
<body>
<div class="banner">
  <div class="panel"></div>
  <div class="strip">
    <img src="../assets/capcut.svg" style="height:30px" alt="CapCut">
    <img src="../assets/ocuco.png" style="height:28px" alt="Ocuco">
    <img src="../assets/cryptodesk-mark.png" style="height:34px" alt="CryptoDesk">
  </div>
  <img class="me" src="../assets/talha-cutout.webp" alt="Talha Mahmood">
  <div class="avail"><i></i>Free link audit · DM me <b>“AUDIT”</b></div>
  <div class="copy">
    <div class="pill">Forget <s>low-quality</s> backlinks.</div>
    <h1>Build <em>authority links</em><br>that move your rankings.</h1>
  </div>
  <p class="label">SERVING BRANDS LIKE</p>
</div>
</body>
</html>
